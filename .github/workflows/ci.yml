name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Byte-compile
        run: python -m compileall -q claude_usage app_main.py setup.py

      - name: Version flag matches package
        run: |
          pkg=$(python -c "import claude_usage; print(claude_usage.__version__)")
          out=$(python -m claude_usage --version)
          echo "package=$pkg  cli='$out'"
          test "$out" = "claude-usage $pkg"

      - name: Tests
        run: pytest -q
