name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tag must match claude_usage.__version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import claude_usage; print(claude_usage.__version__)")
          echo "tag=$tag  package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $pkg"
            exit 1
          fi

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint + tests
        run: |
          ruff check .
          pytest -q

      - name: Build ClaudeUsage.app
        run: PY=python ./build.sh

      - name: Zip the bundle
        run: |
          ditto -c -k --keepParent \
            dist/ClaudeUsage.app "dist/ClaudeUsage-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "dist/ClaudeUsage-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "dist/ClaudeUsage-${GITHUB_REF_NAME}.zip"
